<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<!-- Privacidad: lo único externo permitido es Google (entrar con vuestra cuenta). Nada más se conecta a ningún sitio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://accounts.google.com https://www.gstatic.com; script-src 'unsafe-inline' https://accounts.google.com/gsi/client https://apis.google.com https://www.gstatic.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com; img-src data: 'self' https://*.googleusercontent.com https://*.gstatic.com; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://content.googleapis.com https://apis.google.com; form-action 'none'">
<title>Panel de vida</title>
<!-- App instalable: ficha, icono y nombre en la pantalla de inicio -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icono-192.png">
<link rel="apple-touch-icon" href="icons/icono-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root {
    --fondo: #000;
    --tarjeta: #1c1c1e;
    --tarjeta-2: #2c2c2e;
    --linea: #38383a;
    --texto: #f5f5f7;
    --texto-2: #a1a1a6;
    --agenda: #0a84ff;
    --vence: #ff9f0a;
    --dinero: #30d158;
    --suscripciones: #bf5af2;
    --habitos: #ffd60a;
    --compra: #ff375f;
    --archivos: #64d2ff;
    --radio: 18px;
    --hueco: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--agenda) 45%, transparent); color: #fff; }
  :focus-visible { outline: 2px solid var(--agenda); outline-offset: 3px; border-radius: 8px; }
  html { scrollbar-color: var(--tarjeta-2) var(--fondo); }

  .pagina {
    max-width: 1180px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) max(var(--hueco), env(safe-area-inset-right)) 48px max(var(--hueco), env(safe-area-inset-left));
  }

  .cabecera { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  /* Cuenta de Google: arriba a la derecha */
  .cuenta { display: flex; align-items: center; gap: 10px; min-height: 40px; flex: none; }
  /* Los botones de Google van en un iframe claro: sin esto el navegador le pinta un fondo blanco opaco en la página oscura */
  iframe { color-scheme: light; }
  .cuenta img { width: 36px; height: 36px; border-radius: 50%; background: var(--tarjeta-2); }
  .cuenta-nombre { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .cuenta-nombre small { display: block; font-size: 12px; font-weight: 500; color: var(--texto-2); }
  .cuenta .boton-texto { --color: var(--texto-2); font-size: 14px; }
  .cuenta-aviso { margin: 0; font-size: 13px; color: var(--texto-2); max-width: 22ch; text-align: right; }
  @media (max-width: 600px) {
    .cuenta-nombre { display: none; }
    /* En el móvil, la cuenta va en su propia fila encima de la fecha, para no apretar el saludo */
    .cabecera { flex-wrap: wrap; }
    .cuenta:has(.sinc) { order: -1; width: 100%; justify-content: flex-end; min-height: 0; }
  }
  .fecha {
    margin: 0 0 2px;
    color: var(--texto-2);
    font-size: 15px;
    font-weight: 600;
  }
  .saludo {
    margin: 0;
    font-size: clamp(32px, 6vw, 44px);
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .rejilla {
    display: grid;
    gap: var(--hueco);
    grid-template-columns: repeat(6, 1fr);
  }
  .area {
    grid-column: span 2;
    background: var(--tarjeta);
    border-radius: var(--radio);
    padding: 18px 18px 20px;
    min-height: 168px;
  }
  .area--ancha { grid-column: span 3; }
  .area--entera { grid-column: 1 / -1; }
  .area h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--color);
  }
  .area h2 svg { width: 18px; height: 18px; flex: none; }
  .area .vacio { margin: 0; color: var(--texto-2); font-size: 15px; max-width: 40ch; }

  /* Cabecera de cada apartado con su botón */
  .area-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .area-cabecera h2 { margin: 0; }
  .boton-texto {
    font: inherit; font-size: 15px; font-weight: 600;
    color: var(--color); background: none; border: 0; padding: 6px 4px; cursor: pointer; border-radius: 8px;
  }
  .boton-texto:hover { opacity: .8; }

  /* Formularios */
  .formulario { display: grid; gap: 10px; margin: 0 0 16px; padding: 14px; background: var(--tarjeta-2); border-radius: 14px; }
  .formulario[hidden], .formulario label[hidden] { display: none; }
  /* Archivos */
  .area-cabecera:has(.archivos-botones) { flex-wrap: wrap; row-gap: 4px; }
  .archivos-botones { display: flex; gap: 14px; margin-left: -4px; }
  .archivos-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; color: var(--texto-2); }
  .archivos-barra:empty { display: none; }
  .archivos-barra a.boton { text-decoration: none; overflow-wrap: anywhere; }
  .archivos-barra p { margin: 0; flex: 1 1 100%; }
  .archivos-barra + #archivos-contenido { margin-top: 12px; }
  .archivos-barra:empty + #archivos-contenido { margin-top: 0; }
  .archivos-lista { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 24px; }
  .archivo { border-top: 1px solid var(--linea); }
  .archivo-enlace { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: inherit; text-decoration: none; border-radius: 8px; }
  .archivo-enlace:hover .archivo-nombre { color: var(--color); }
  .archivo-ico { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--color); background: color-mix(in srgb, var(--color) 16%, transparent); }
  .archivo-ico svg { width: 20px; height: 20px; }
  .archivo-texto { min-width: 0; }
  .archivo-nombre { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .archivo-meta { display: block; font-size: 13px; color: var(--texto-2); overflow-wrap: anywhere; }
  .duraciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -2px; }
  .duracion {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--color); cursor: pointer; min-height: 34px;
    padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--color) 45%, transparent); background: none;
  }
  .duracion:hover { background: color-mix(in srgb, var(--color) 15%, transparent); }
  .formulario .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .formulario label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--texto-2); }
  .formulario input {
    font: inherit; font-size: 16px; color: var(--texto);
    background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px;
    padding: 9px 10px; min-width: 0; width: 100%; color-scheme: dark;
  }
  .formulario input:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
  .formulario .acciones { display: flex; gap: 8px; justify-content: flex-end; }
  .boton {
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 10px; padding: 9px 16px;
    background: var(--tarjeta); color: var(--texto);
  }
  .boton--principal { background: var(--boton, var(--color)); color: #fff; }
  .boton:hover { filter: brightness(1.12); }
  .error { margin: 0; color: #ff6961; font-size: 14px; }

  /* Agenda */
  .agenda-dia + .agenda-dia { margin-top: 14px; }
  .agenda-dia h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--texto-2); }
  .agenda-lista { list-style: none; margin: 0; padding: 0; }
  .evento {
    display: grid; grid-template-columns: 58px 10px 1fr auto; align-items: center; gap: 10px;
    padding: 8px 0; border-top: 1px solid var(--linea);
  }
  .agenda-lista li:first-child { border-top: 0; }
  .evento-hora { font-size: 15px; font-weight: 600; }
  .evento-hora small { display: block; font-size: 12px; font-weight: 500; color: var(--texto-2); }
  .evento-punto { width: 10px; height: 10px; border-radius: 50%; background: var(--punto, var(--agenda)); }
  .evento-texto { min-width: 0; }
  .agenda-google { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 14px; color: var(--texto-2); }
  .agenda-google:empty { display: none; }
  .agenda-google p { margin: 0; }
  .cal-menu { position: relative; }
  .cal-resumen {
    display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 12px; cursor: pointer; list-style: none;
    font-size: 14px; font-weight: 600; color: var(--texto); border: 1px solid var(--linea); border-radius: 999px; background: var(--tarjeta-2);
  }
  .cal-resumen::-webkit-details-marker { display: none; }
  .cal-resumen::after { content: ''; width: 7px; height: 7px; border: solid var(--texto-2); border-width: 0 2px 2px 0; transform: translateY(-2px) rotate(45deg); }
  .cal-menu[open] .cal-resumen::after { transform: translateY(2px) rotate(225deg); }
  .cal-puntos { display: inline-flex; }
  .cal-puntos .cal-punto + .cal-punto { margin-left: -3px; }
  .cal-punto { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cal); box-shadow: 0 0 0 2px var(--tarjeta-2); }
  .cal-lista {
    position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: min(340px, calc(100vw - 48px));
    padding: 6px; background: var(--tarjeta-2); border: 1px solid var(--linea); border-radius: 14px; box-shadow: 0 12px 32px rgb(0 0 0 / .5);
  }
  .cal-opcion { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border-radius: 10px; cursor: pointer; color: var(--texto); font-size: 15px; }
  .cal-opcion:hover { background: color-mix(in srgb, var(--texto) 8%, transparent); }
  .cal-opcion input { width: 18px; height: 18px; margin: 0; accent-color: var(--cal); flex: none; }
  .cal-nombre { overflow-wrap: anywhere; }
  .evento-titulo { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .evento-lugar { display: block; font-size: 14px; color: var(--texto-2); overflow-wrap: anywhere; }
  .evento--pasado { opacity: .7; }
  .evento--pasado .evento-lugar { display: none; }
  .evento--pasado .evento-punto { background: var(--texto-2); }
  .chip {
    display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; vertical-align: 1px;
    font-size: 12px; font-weight: 600; color: var(--color); background: color-mix(in srgb, var(--color) 18%, transparent);
  }
  .borrar {
    width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer;
    background: none; border: 0; border-radius: 50%; color: var(--texto-2); opacity: 0;
  }
  .evento:hover .borrar, .borrar:focus-visible { opacity: 1; }
  .borrar:hover { background: var(--tarjeta-2); color: var(--texto); }
  .borrar svg { width: 16px; height: 16px; }
  @media (hover: none) { .borrar { opacity: 1; } }

  /* Lo que vence */
  .resumen { margin: 0 0 12px; color: var(--texto-2); font-size: 15px; }
  .resumen strong { color: var(--texto); font-size: 22px; font-weight: 700; margin-right: 4px; }
  .resumen .alerta { color: #ff6961; font-weight: 600; }
  .vence {
    display: grid; grid-template-columns: 46px 1fr auto 32px; align-items: center; gap: 12px;
    padding: 8px 0; border-top: 1px solid var(--linea);
  }
  .vence-fecha {
    display: grid; place-items: center; height: 46px; border-radius: 12px; background: var(--tarjeta-2);
    line-height: 1.05;
  }
  .vence-fecha b { font-size: 18px; }
  .vence-fecha span { font-size: 12px; color: var(--texto-2); }
  .vence-texto { min-width: 0; }
  .vence-titulo { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .vence-estado { display: block; font-size: 14px; color: var(--texto-2); }
  .vence--pronto .vence-estado { color: var(--vence); }
  .vence--urgente .vence-estado { color: #ff6961; font-weight: 600; }
  .vence--urgente .vence-fecha { background: color-mix(in srgb, #ff453a 22%, transparent); }
  .vence-importe { font-weight: 600; white-space: nowrap; }
  .hecho {
    width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; padding: 0;
    background: none; border: 2px solid #6e6e73; border-radius: 50%; color: transparent;
  }
  .vence--hecho { grid-template-columns: 1fr auto; color: var(--texto-2); min-height: 62px; }
  .hecho:hover { border-color: var(--dinero); color: var(--dinero); }
  .hecho svg { width: 16px; height: 16px; }
  .mas { margin: 8px 0 0; font-size: 14px; color: var(--texto-2); }

  /* Dinero */
  .formulario select {
    font: inherit; font-size: 16px; color: var(--texto); background: var(--tarjeta);
    border: 1px solid var(--linea); border-radius: 10px; padding: 9px 10px; width: 100%; color-scheme: dark;
  }
  .formulario select:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
  .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 16px; }
  .cifras div { padding: 0 0 0 12px; border-left: 1px solid var(--linea); min-width: 0; }
  .cifras div:first-child { border-left: 0; padding-left: 0; }
  .cifras dt { font-size: 12px; font-weight: 600; color: var(--texto-2); }
  .cifras dd { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cifras .positivo { color: var(--dinero); }
  .cifras .negativo { color: #ff6961; }
  .subtitulo { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--texto-2); }
  .barras { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 9px; }
  .barra-fila { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
  .barra-fila span:last-child { font-weight: 600; }
  .barra { height: 8px; border-radius: 4px; background: var(--tarjeta-2); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 4px; background: var(--dinero); }
  .mov { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linea); }
  .mov-texto { min-width: 0; }
  .mov-texto b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .mov-texto span { font-size: 13px; color: var(--texto-2); }
  .mov-importe { font-weight: 600; white-space: nowrap; }
  .mov-importe.ingreso { color: var(--dinero); }
  .mov:hover .borrar { opacity: 1; }

  /* Suscripciones */
  .reparto { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; margin: 0 0 14px; }
  .reparto i { display: block; background: var(--suscripciones); }
  .sus { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linea); }
  .sus-texto { min-width: 0; }
  .sus-texto b { display: flex; align-items: center; gap: 8px; font-weight: 600; overflow-wrap: anywhere; }
  .sus-texto b i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--suscripciones); }
  .sus-texto span { font-size: 13px; color: var(--texto-2); }
  .sus--pronto .sus-texto span { color: var(--suscripciones); font-weight: 600; }
  .sus-importe { font-weight: 600; white-space: nowrap; text-align: right; }
  .sus-importe small { display: block; font-size: 12px; font-weight: 500; color: var(--texto-2); }
  .sus:hover .borrar { opacity: 1; }

  /* Hábitos */
  .habito { padding: 10px 0; border-top: 1px solid var(--linea); }
  .habito-cabeza { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; gap: 8px; margin-bottom: 8px; }
  .habito-cabeza b { font-weight: 600; overflow-wrap: anywhere; }
  .racha { font-size: 13px; color: var(--texto-2); white-space: nowrap; }
  .racha--viva { color: var(--habitos); font-weight: 600; }
  .habito:hover .borrar { opacity: 1; }
  .semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dia-boton {
    display: grid; justify-items: center; gap: 3px; padding: 0; cursor: pointer;
    background: none; border: 0; color: var(--texto-2); font: inherit; font-size: 11px; font-weight: 600;
  }
  .dia-boton span {
    display: grid; place-items: center; width: 100%; max-width: 36px; aspect-ratio: 1; border-radius: 10px;
    background: var(--tarjeta-2); color: transparent;
  }
  .dia-boton svg { width: 14px; height: 14px; }
  .dia-boton[aria-pressed="true"] span { background: var(--habitos); color: #1c1c1e; }
  .dia-boton--hoy { color: var(--texto); }
  .dia-boton--hoy span { box-shadow: inset 0 0 0 2px var(--habitos); }
  .dia-boton:hover span { filter: brightness(1.2); }


  /* Lista de la compra */
  .compra-anadir { display: grid; grid-template-columns: 1fr 110px 190px auto; gap: 8px; margin: 0 0 16px; }
  .compra-anadir input, .compra-anadir select {
    font: inherit; font-size: 16px; color: var(--texto); background: var(--tarjeta-2);
    border: 1px solid var(--linea); border-radius: 10px; padding: 9px 10px; min-width: 0; width: 100%; color-scheme: dark;
  }
  .compra-anadir input:focus-visible, .compra-anadir select:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
  .compra-anadir .error { grid-column: 1 / -1; }
  .pasillos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 24px; align-items: start; }
  .pasillo h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--texto-2); }
  .pasillo + .pasillo { margin-top: 0; }
  .pasillo { margin-bottom: 12px; }
  .articulo { display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--linea); }
  .agenda-lista .articulo:first-child { border-top: 0; }
  .articulo-texto { min-width: 0; overflow-wrap: anywhere; }
  .articulo-texto small { margin-left: 6px; font-size: 14px; color: var(--texto-2); }
  .articulo--hecho .articulo-texto { color: var(--texto-2); text-decoration: line-through; }
  .articulo .hecho:hover { border-color: var(--compra); color: var(--compra); }
  .articulo--hecho .hecho { background: var(--compra); border-color: var(--compra); color: #1c1c1e; }
  .comprados-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  @media (max-width: 600px) {
    .compra-anadir { grid-template-columns: 1fr 96px; }
    .compra-anadir select { grid-column: 1; }
  }

  /* Datos compartidos en Drive */
  .drive { margin-bottom: 20px; }
  .drive-titulo { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .drive-texto { margin: 0 0 12px; color: var(--texto-2); font-size: 14px; max-width: 70ch; }
  .drive-compartir { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; max-width: 520px; }
  .drive-compartir input {
    flex: 1 1 220px; min-width: 0; font: inherit; font-size: 16px; color: var(--texto); color-scheme: dark;
    background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 9px 10px;
  }
  .drive-compartir .boton--principal { --boton: #0066d6; }
  .drive .pie-botones .boton--principal { --boton: #0066d6; }
  .sinc {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    border: 0; border-radius: 999px; padding: 5px 10px; color: var(--texto-2); background: var(--tarjeta);
  }
  .sinc--ok { color: var(--dinero); }
  .sinc--token, .sinc--sinred { color: var(--vence); }
  .sinc--error { color: #ff6961; }
  .sinc:disabled { cursor: progress; opacity: .8; }

  /* Pie: copia de seguridad */
  .pie { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--linea); }
  .pie-texto { margin: 0 0 12px; color: var(--texto-2); font-size: 14px; max-width: 70ch; }
  .pie-botones { display: flex; flex-wrap: wrap; gap: 8px; }
  .pie .boton { background: var(--tarjeta); }
  .boton--peligro { color: #ff6961; }
  .pie-aviso { margin: 10px 0 0; min-height: 1.4em; font-size: 14px; color: var(--dinero); }
  .pie-aviso.mal { color: #ff6961; }

  @media (max-width: 900px) {
    .rejilla { grid-template-columns: repeat(2, 1fr); }
    .area, .area--ancha, .area--entera { grid-column: span 1; }
  }
  @media (max-width: 600px) {
    /* En el móvil, lo urgente primero */
    section[aria-labelledby="t-vence"] { order: -1; }
    .rejilla { grid-template-columns: 1fr; gap: 12px; }
    .area { min-height: 0; }

  }
</style>

<script>
  // Fecha y saludo en español de España, según la hora del ordenador.
  const ahora = new Date();
  const fecha = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(ahora);
  document.getElementById('fecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);
  const h = ahora.getHours();
  const saludoBase = h >= 6 && h < 14 ? 'Buenos días' : h >= 14 && h < 21 ? 'Buenas tardes' : 'Buenas noches';
  // Con sesión iniciada, el saludo lleva el nombre de pila: «Buenos días, Ricard»
  const pintarSaludo = (nombre) => { document.getElementById('saludo').textContent = nombre ? `${saludoBase}, ${nombre}` : saludoBase; };
  pintarSaludo();

  // ---------- Datos: solo en este navegador (localStorage), nunca salen de aquí ----------
  const CLAVE = 'panel-de-vida';
  // Fecha local en formato AAAA-MM-DD (para guardar y comparar días).
  const diaISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const masDias = (n) => { const d = new Date(ahora); d.setDate(d.getDate() + n); return diaISO(d); };
  const hoy = diaISO(ahora);

  function datosDeEjemplo() {
    return {
      ejemplo: true,
      agenda: [
        { id: 'e1', titulo: 'Café con Laura', fecha: hoy, hora: '09:30', lugar: 'Café Central' },
        { id: 'e2', titulo: 'Clase de yoga', fecha: hoy, hora: '18:00', lugar: 'Gimnasio del barrio' },
        { id: 'e3', titulo: 'Comida familiar', fecha: masDias(1), hora: '14:00', lugar: 'Casa de mis padres' },
        { id: 'e4', titulo: 'Reunión de equipo', fecha: masDias(2), hora: '09:00', lugar: '' },
        { id: 'e5', titulo: 'Dentista', fecha: masDias(3), hora: '17:15', lugar: 'Clínica dental' },
        { id: 'e6', titulo: 'Cumpleaños de Marta', fecha: masDias(5), hora: '', lugar: '' },
      ],
      vence: [
        { id: 'v1', titulo: 'Devolver libro a la biblioteca', fecha: masDias(-1), importe: null },
        { id: 'v2', titulo: 'Recibo de la luz', fecha: masDias(2), importe: 68.4 },
        { id: 'v3', titulo: 'ITV del coche', fecha: masDias(4), importe: 41.6 },
        { id: 'v4', titulo: 'IBI (contribución)', fecha: masDias(9), importe: 412.35 },
        { id: 'v5', titulo: 'Seguro del coche', fecha: masDias(21), importe: 389 },
        { id: 'v6', titulo: 'Renovar el DNI', fecha: masDias(48), importe: 12 },
      ],
      dinero: [
        ['ingreso', 'Nómina', 2450, 'Ingresos', 1],
        ['gasto', 'Alquiler', 850, 'Casa', 1],
        ['gasto', 'Supermercado', 86.4, 'Comida', 2],
        ['gasto', 'Gasolina', 60, 'Transporte', 4],
        ['gasto', 'Supermercado', 54.2, 'Comida', 7],
        ['gasto', 'Cena con amigos', 45.5, 'Ocio', 8],
        ['gasto', 'Farmacia', 18.9, 'Salud', 10],
        ['gasto', 'Zapatillas', 79.99, 'Compras', 11],
        ['gasto', 'Supermercado', 112.75, 'Comida', 13],
        ['gasto', 'Cine', 19, 'Ocio', 14],
      ].map(([tipo, concepto, importe, categoria, dia], i) => ({
        id: 'd' + i, tipo, concepto, importe, categoria,
        fecha: diaISO(new Date(ahora.getFullYear(), ahora.getMonth(), Math.min(dia, ahora.getDate()))),
      })),
      suscripciones: [
        { id: 's1', nombre: 'Gimnasio', importe: 39.9, periodo: 'mensual', fecha: masDias(17) },
        { id: 's2', nombre: 'Netflix', importe: 13.99, periodo: 'mensual', fecha: masDias(6) },
        { id: 's3', nombre: 'Spotify', importe: 11.99, periodo: 'mensual', fecha: masDias(12) },
        { id: 's4', nombre: 'Amazon Prime', importe: 49.9, periodo: 'anual', fecha: masDias(90) },
        { id: 's5', nombre: 'iCloud', importe: 2.99, periodo: 'mensual', fecha: masDias(1) },
      ],
      // Patrón de días hechos (1) en las últimas 3 semanas, del más antiguo a hoy.
      habitos: [
        ['h1', 'Leer 20 minutos', '101101111011011111110'],
        ['h2', 'Caminar 30 minutos', '110110100111011010110'],
        ['h3', 'Meditar', '000100110010011101111'],
        ['h4', 'Sin pantallas antes de dormir', '100010011000110101000'],
      ].map(([id, nombre, patron]) => ({
        id, nombre, hechos: [...patron].flatMap((c, i) => (c === '1' ? [masDias(i - patron.length + 1)] : [])),
      })),
      compra: [
        ['c1', 'Plátanos', '1 kg', 'Fruta y verdura', false],
        ['c2', 'Tomates', '6', 'Fruta y verdura', false],
        ['c3', 'Pechuga de pollo', '500 g', 'Carne y pescado', false],
        ['c4', 'Leche', '6 l', 'Lácteos y huevos', false],
        ['c5', 'Huevos', '12', 'Lácteos y huevos', true],
        ['c6', 'Pan de molde', '', 'Panadería', false],
        ['c7', 'Aceite de oliva', '1 l', 'Despensa', false],
        ['c8', 'Arroz', '', 'Despensa', true],
        ['c9', 'Detergente', '', 'Limpieza y hogar', false],
      ].map(([id, nombre, cantidad, seccion, comprado]) => ({ id, nombre, cantidad, seccion, comprado })),
    };
  }
  function cargar() {
    try { return JSON.parse(localStorage.getItem(CLAVE)); } catch { return null; }
  }
  function guardarLocal() {
    try { localStorage.setItem(CLAVE, JSON.stringify(datos)); }
    catch { /* el navegador no deja guardar (p. ej. modo privado): el panel sigue funcionando */ }
  }
  // Guarda en este dispositivo y, si estáis conectados a Drive, lo sube al poco rato.
  function guardar() { guardarLocal(); programarSincronizacion(); }
  // Completa los apartados que falten (datos guardados con una versión anterior del panel).
  function completar(d) {
    const ej = d.ejemplo ? datosDeEjemplo() : {};
    for (const [clave, vacio] of [['agenda', []], ['vence', []], ['dinero', []], ['suscripciones', []], ['habitos', []], ['compra', []], ['archivos', []]]) {
      if (!d[clave] || typeof d[clave] !== 'object') d[clave] = ej[clave] || vacio;
    }
    delete d.salud; // el apartado de salud se quitó el 15/11/2026
    return d;
  }
  const datos = completar(cargar() || datosDeEjemplo());

  // Euros con formato español: 1.234,56 €
  const fmtEuros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', useGrouping: 'always' });
  const euros = (n) => fmtEuros.format(n);
  // Lee "1.234,56", "68,4" o "68.40" como número; devuelve null si no es válido.
  function leerImporte(texto) {
    let t = texto.trim().replace(/\s|€/g, '');
    if (!t) return null;
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    const n = Number(t);
    return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
  }
  // Días que faltan desde hoy hasta una fecha AAAA-MM-DD (negativo si ya pasó).
  function diasHasta(iso) {
    const [a, m, d] = iso.split('-').map(Number);
    const hoy0 = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
    return Math.round((new Date(a, m - 1, d) - hoy0) / 864e5);
  }

  // Pequeña ayuda para crear elementos sin riesgo de inyectar HTML.
  function el(etiqueta, clase, texto) {
    const n = document.createElement(etiqueta);
    if (clase) n.className = clase;
    if (texto != null) n.textContent = texto;
    return n;
  }
  const icoBorrar = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  // ---------- Agenda ----------
  const fmtDia = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  function nombreDelDia(iso) {
    if (iso === hoy) return 'Hoy';
    if (iso === masDias(1)) return 'Mañana';
    const [a, m, d] = iso.split('-').map(Number);
    const t = fmtDia.format(new Date(a, m - 1, d));
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function minutosHasta(hora) {
    const [hh, mm] = hora.split(':').map(Number);
    return hh * 60 + mm - (new Date().getHours() * 60 + new Date().getMinutes());
  }
  function textoFalta(min) {
    if (min < 60) return `en ${min} min`;
    const h = Math.floor(min / 60), m = min % 60;
    return m ? `en ${h} h ${m} min` : `en ${h} h`;
  }

  function pintarAgenda() {
    const caja = document.getElementById('agenda-contenido');
    caja.replaceChildren();
    const limite = masDias(6);
    const proximas = [...datos.agenda, ...eventosCalendario()]
      .filter((c) => c.fecha >= hoy && c.fecha <= limite)
      .sort((a, b) => (a.fecha + (a.hora || '')).localeCompare(b.fecha + (b.hora || '')));

    if (!proximas.some((c) => c.fecha === hoy)) {
      proximas.unshift({ vacioHoy: true, fecha: hoy });
    }
    let siguienteMarcada = false;
    const dias = [...new Set(proximas.map((c) => c.fecha))];
    for (const dia of dias) {
      const bloque = el('div', 'agenda-dia');
      bloque.append(el('h3', null, nombreDelDia(dia)));
      const lista = el('ul', 'agenda-lista');
      for (const c of proximas.filter((x) => x.fecha === dia)) {
        if (c.vacioHoy) { lista.append(el('li', 'vacio', 'Hoy no tienes nada apuntado.')); continue; }
        const li = el('li', 'evento');
        const hora = el('span', 'evento-hora', c.hora || 'Todo');
        if (!c.hora) hora.append(el('small', null, 'el día'));
        const texto = el('span', 'evento-texto');
        const titulo = el('span', 'evento-titulo', c.titulo);
        if (dia === hoy && c.hora) {
          const falta = minutosHasta(c.hora);
          if (falta < 0) li.classList.add('evento--pasado');
          else if (!siguienteMarcada) { titulo.append(el('span', 'chip', textoFalta(falta))); siguienteMarcada = true; }
        }
        texto.append(titulo);
        if (c.lugar) texto.append(el('span', 'evento-lugar', c.lugar));
        const punto = el('span', 'evento-punto');
        if (c.color) punto.style.setProperty('--punto', c.color);
        if (c.cal && !c.escribe) { li.append(hora, punto, texto, el('span')); lista.append(li); continue; } // calendario de solo lectura
        const borrar = el('button', 'borrar');
        borrar.type = 'button';
        borrar.innerHTML = icoBorrar;
        borrar.setAttribute('aria-label', `Borrar «${c.titulo}»`);
        borrar.addEventListener('click', () => {
          if (c.cal) return borrarCitaGoogle(c);
          if (!confirm(`¿Borrar «${c.titulo}» de la agenda?`)) return;
          datos.agenda = datos.agenda.filter((x) => x.id !== c.id);
          guardar(); pintarAgenda();
        });
        li.append(hora, punto, texto, borrar);
        lista.append(li);
      }
      bloque.append(lista);
      caja.append(bloque);
    }
  }

  // ---------- Lo que vence ----------
  const fmtMes = new Intl.DateTimeFormat('es-ES', { month: 'short' });
  const icoHecho = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  function textoEstado(d) {
    if (d < -1) return `Venció hace ${-d} días`;
    if (d === -1) return 'Venció ayer';
    if (d === 0) return 'Vence hoy';
    if (d === 1) return 'Vence mañana';
    return `Faltan ${d} días`;
  }
  const recienHechos = new Set();
  function pintarVence() {
    const caja = document.getElementById('vence-contenido');
    caja.replaceChildren();
    const pendientes = datos.vence.filter((v) => !v.hecho || recienHechos.has(v.id)).sort((a, b) => a.fecha.localeCompare(b.fecha));
    const cerca = pendientes.filter((v) => diasHasta(v.fecha) <= 30);
    const masAdelante = pendientes.length - cerca.length;

    if (!cerca.length) {
      caja.append(el('p', 'vacio', 'No tienes nada pendiente en los próximos 30 días.'));
    } else {
      const total = cerca.filter((v) => !v.hecho).reduce((s, v) => s + (v.importe || 0), 0);
      const vencidos = cerca.filter((v) => !v.hecho && diasHasta(v.fecha) < 0).length;
      const resumen = el('p', 'resumen');
      resumen.append(el('strong', null, euros(total)), 'por pagar en 30 días');
      if (vencidos) resumen.append(' · ', el('span', 'alerta', vencidos === 1 ? '1 vencido' : `${vencidos} vencidos`));
      caja.append(resumen);

      const lista = el('ul', 'agenda-lista');
      for (const v of cerca) {
        if (v.hecho) {
          // Recién marcado: se puede deshacer hasta que cierres el panel
          const li = el('li', 'vence vence--hecho');
          const deshacer = el('button', 'boton-texto', 'Deshacer');
          deshacer.type = 'button';
          deshacer.addEventListener('click', () => { v.hecho = false; recienHechos.delete(v.id); guardar(); pintarVence(); });
          li.append(el('span', 'vence-texto', `«${v.titulo}» hecho`), deshacer);
          lista.append(li);
          continue;
        }
        const d = diasHasta(v.fecha);
        const li = el('li', 'vence' + (d <= 0 ? ' vence--urgente' : d <= 3 ? ' vence--pronto' : ''));
        const [a, m, dia] = v.fecha.split('-').map(Number);
        const cuadro = el('span', 'vence-fecha');
        cuadro.append(el('b', null, String(dia)), el('span', null, fmtMes.format(new Date(a, m - 1, dia)).replace('.', '')));
        const texto = el('span', 'vence-texto');
        texto.append(el('span', 'vence-titulo', v.titulo), el('span', 'vence-estado', textoEstado(d)));
        const boton = el('button', 'hecho');
        boton.type = 'button';
        boton.innerHTML = icoHecho;
        boton.title = 'Marcar como hecho';
        boton.setAttribute('aria-label', `Marcar «${v.titulo}» como hecho`);
        boton.addEventListener('click', () => { v.hecho = true; recienHechos.add(v.id); guardar(); pintarVence(); });
        li.append(cuadro, texto, el('span', 'vence-importe', v.importe != null ? euros(v.importe) : ''), boton);
        lista.append(li);
      }
      caja.append(lista);
    }
    if (masAdelante) caja.append(el('p', 'mas', masAdelante === 1 ? 'Y 1 más para dentro de un mes o más.' : `Y ${masAdelante} más para dentro de un mes o más.`));
  }

  // ---------- Dinero del mes ----------
  const CATEGORIAS_GASTO = ['Casa', 'Comida', 'Transporte', 'Ocio', 'Salud', 'Compras', 'Otros'];
  const CATEGORIAS_INGRESO = ['Ingresos', 'Otros'];
  const mesActual = hoy.slice(0, 7);
  const nombreMes = new Intl.DateTimeFormat('es-ES', { month: 'long' }).format(ahora);
  document.getElementById('dinero-titulo').textContent = `Dinero de ${nombreMes}`;
  const fmtDiaCorto = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' });

  function pintarDinero() {
    const caja = document.getElementById('dinero-contenido');
    caja.replaceChildren();
    const delMes = datos.dinero.filter((m) => m.fecha.startsWith(mesActual));
    if (!delMes.length) { caja.append(el('p', 'vacio', `Aún no has apuntado nada en ${nombreMes}.`)); return; }

    const suma = (tipo) => delMes.filter((m) => m.tipo === tipo).reduce((s, m) => s + m.importe, 0);
    const ingresos = suma('ingreso'), gastos = suma('gasto'), queda = ingresos - gastos;
    const cifras = el('dl', 'cifras');
    for (const [nombre, valor, clase] of [['Ingresos', euros(ingresos), 'positivo'], ['Gastos', euros(gastos), ''], ['Te queda', euros(queda), queda < 0 ? 'negativo' : '']]) {
      const d = el('div'); d.append(el('dt', null, nombre), el('dd', clase, valor)); cifras.append(d);
    }
    caja.append(cifras);

    // Gráfico: gasto por categoría, de mayor a menor
    const porCategoria = {};
    for (const m of delMes) if (m.tipo === 'gasto') porCategoria[m.categoria] = (porCategoria[m.categoria] || 0) + m.importe;
    const filas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);
    if (filas.length) {
      caja.append(el('h3', 'subtitulo', 'En qué se va'));
      const barras = el('ul', 'barras');
      const max = filas[0][1];
      for (const [cat, total] of filas) {
        const li = el('li');
        const fila = el('div', 'barra-fila');
        fila.append(el('span', null, cat), el('span', null, euros(total)));
        const barra = el('div', 'barra');
        const relleno = el('i');
        relleno.style.width = Math.max(2, (total / max) * 100) + '%';
        barra.append(relleno);
        li.append(fila, barra);
        barras.append(li);
      }
      caja.append(barras);
    }

    // Últimos movimientos
    caja.append(el('h3', 'subtitulo', 'Últimos movimientos'));
    const lista = el('ul', 'agenda-lista');
    const recientes = [...delMes].reverse().sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 4); // mismo día: el último apuntado, primero
    for (const m of recientes) {
      const li = el('li', 'mov');
      const [a, mes, dia] = m.fecha.split('-').map(Number);
      const texto = el('span', 'mov-texto');
      texto.append(el('b', null, m.concepto), el('span', null, `${m.categoria} · ${fmtDiaCorto.format(new Date(a, mes - 1, dia)).replace('.', '')}`));
      const importe = el('span', 'mov-importe' + (m.tipo === 'ingreso' ? ' ingreso' : ''), (m.tipo === 'ingreso' ? '+' : '−') + euros(m.importe));
      const borrar = el('button', 'borrar');
      borrar.type = 'button';
      borrar.innerHTML = icoBorrar;
      borrar.setAttribute('aria-label', `Borrar «${m.concepto}»`);
      borrar.addEventListener('click', () => {
        if (!confirm(`¿Borrar «${m.concepto}» (${euros(m.importe)})?`)) return;
        datos.dinero = datos.dinero.filter((x) => x.id !== m.id);
        guardar(); pintarDinero();
      });
      li.append(texto, importe, borrar);
      lista.append(li);
    }
    caja.append(lista);
  }

  // El desplegable de categorías cambia según sea gasto o ingreso
  function rellenarCategorias(form) {
    const lista = form.tipo.value === 'ingreso' ? CATEGORIAS_INGRESO : CATEGORIAS_GASTO;
    form.categoria.replaceChildren(...lista.map((c) => new Option(c, c)));
  }
  document.getElementById('dinero-form').tipo.addEventListener('change', (e) => rellenarCategorias(e.target.form));

  // ---------- Suscripciones ----------
  // Próximo cobro a partir de hoy: avanza de mes en mes (o de año en año) desde la fecha guardada.
  function proximoCobro(s) {
    const [a, m, d] = s.fecha.split('-').map(Number);
    for (let i = 0; i < 1200; i++) {
      const paso = s.periodo === 'anual' ? 12 * i : i;
      const ultimo = new Date(a, m - 1 + paso + 1, 0).getDate(); // p. ej. día 31 en un mes de 30
      const f = diaISO(new Date(a, m - 1 + paso, Math.min(d, ultimo)));
      if (f >= hoy) return f;
    }
    return hoy;
  }
  const alMes = (s) => (s.periodo === 'anual' ? s.importe / 12 : s.importe);

  function pintarSuscripciones() {
    const caja = document.getElementById('sus-contenido');
    caja.replaceChildren();
    const lista = datos.suscripciones.map((s) => ({ ...s, proximo: proximoCobro(s) }));
    if (!lista.length) { caja.append(el('p', 'vacio', 'No tienes suscripciones apuntadas.')); return; }

    const mensual = lista.reduce((t, s) => t + alMes(s), 0);
    const cifras = el('dl', 'cifras');
    cifras.style.gridTemplateColumns = '1fr 1fr';
    for (const [nombre, valor] of [['Al mes', euros(mensual)], ['Al año', euros(mensual * 12)]]) {
      const d = el('div'); d.append(el('dt', null, nombre), el('dd', null, valor)); cifras.append(d);
    }
    caja.append(cifras);

    // Gráfico: cuánto pesa cada suscripción en el total mensual
    const porPeso = [...lista].sort((a, b) => alMes(b) - alMes(a));
    const reparto = el('div', 'reparto');
    reparto.setAttribute('role', 'img');
    reparto.setAttribute('aria-label', 'Reparto del gasto mensual: ' + porPeso.map((s) => `${s.nombre} ${Math.round((alMes(s) / mensual) * 100)} %`).join(', '));
    porPeso.forEach((s, i) => {
      const trozo = el('i');
      trozo.style.flex = String(alMes(s));
      trozo.style.opacity = String(1 - (i / porPeso.length) * 0.7);
      trozo.title = `${s.nombre}: ${euros(alMes(s))} al mes`;
      reparto.append(trozo);
    });
    caja.append(reparto);

    const ul = el('ul', 'agenda-lista');
    const opacidad = new Map(porPeso.map((s, i) => [s.id, 1 - (i / porPeso.length) * 0.7]));
    for (const s of lista.sort((a, b) => a.proximo.localeCompare(b.proximo))) {
      const faltan = diasHasta(s.proximo);
      const li = el('li', 'sus' + (faltan <= 3 ? ' sus--pronto' : ''));
      const [a, m, d] = s.proximo.split('-').map(Number);
      const cuando = faltan === 0 ? 'Se cobra hoy' : faltan === 1 ? 'Se cobra mañana' : `Se cobra el ${fmtDiaCorto.format(new Date(a, m - 1, d)).replace('.', '')} · en ${faltan} días`;
      const texto = el('span', 'sus-texto');
      const nombre = el('b');
      const punto = el('i');
      punto.style.opacity = String(opacidad.get(s.id));
      nombre.append(punto, s.nombre);
      texto.append(nombre, el('span', null, cuando));
      const importe = el('span', 'sus-importe', euros(s.importe));
      importe.append(el('small', null, s.periodo === 'anual' ? 'al año' : 'al mes'));
      const borrar = el('button', 'borrar');
      borrar.type = 'button';
      borrar.innerHTML = icoBorrar;
      borrar.setAttribute('aria-label', `Borrar «${s.nombre}»`);
      borrar.addEventListener('click', () => {
        if (!confirm(`¿Borrar la suscripción «${s.nombre}»?`)) return;
        datos.suscripciones = datos.suscripciones.filter((x) => x.id !== s.id);
        guardar(); pintarSuscripciones();
      });
      li.append(texto, importe, borrar);
      ul.append(li);
    }
    caja.append(ul);
  }

  // ---------- Hábitos ----------
  const LETRA_DIA = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  const fmtDiaLargo = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const icoCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  // Días seguidos cumplidos hasta hoy (si hoy aún no está marcado, cuenta desde ayer).
  function racha(h) {
    const hechos = new Set(h.hechos);
    let n = 0, i = hechos.has(hoy) ? 0 : -1;
    while (hechos.has(masDias(i - n))) n++;
    return n;
  }
  function pintarHabitos() {
    const caja = document.getElementById('hab-contenido');
    caja.replaceChildren();
    if (!datos.habitos.length) { caja.append(el('p', 'vacio', 'Añade un hábito para empezar a marcarlo cada día.')); return; }

    const hoyHechos = datos.habitos.filter((h) => h.hechos.includes(hoy)).length;
    const resumen = el('p', 'resumen');
    resumen.append(el('strong', null, `${hoyHechos} de ${datos.habitos.length}`), 'hechos hoy');
    caja.append(resumen);

    for (const h of datos.habitos) {
      const fila = el('div', 'habito');
      const cabeza = el('div', 'habito-cabeza');
      const r = racha(h);
      const borrar = el('button', 'borrar');
      borrar.type = 'button';
      borrar.innerHTML = icoBorrar;
      borrar.setAttribute('aria-label', `Borrar el hábito «${h.nombre}»`);
      borrar.addEventListener('click', () => {
        if (!confirm(`¿Borrar el hábito «${h.nombre}» y todo su historial?`)) return;
        datos.habitos = datos.habitos.filter((x) => x.id !== h.id);
        guardar(); pintarHabitos();
      });
      cabeza.append(el('b', null, h.nombre), el('span', 'racha' + (r >= 3 ? ' racha--viva' : ''), r === 1 ? '1 día seguido' : `${r} días seguidos`), borrar);

      // Últimos 7 días: cada cuadrado se toca para marcar o desmarcar ese día
      const semana = el('div', 'semana');
      for (let i = -6; i <= 0; i++) {
        const iso = masDias(i);
        const [a, m, d] = iso.split('-').map(Number);
        const fecha = new Date(a, m - 1, d);
        const hecho = h.hechos.includes(iso);
        const b = el('button', 'dia-boton' + (i === 0 ? ' dia-boton--hoy' : ''));
        b.type = 'button';
        b.setAttribute('aria-pressed', String(hecho));
        b.setAttribute('aria-label', `${h.nombre}, ${i === 0 ? 'hoy' : fmtDiaLargo.format(fecha)}`);
        const cuadro = el('span');
        cuadro.innerHTML = icoCheck;
        b.append(cuadro, i === 0 ? 'Hoy' : LETRA_DIA[fecha.getDay()]);
        b.addEventListener('click', () => {
          h.hechos = hecho ? h.hechos.filter((x) => x !== iso) : [...h.hechos, iso];
          guardar(); pintarHabitos();
        });
        semana.append(b);
      }
      fila.append(cabeza, semana);
      caja.append(fila);
    }
  }

  // ---------- Formularios: abrir, cancelar, comprobar y guardar ----------
  // alGuardar(form) devuelve [mensaje, campo] si algo falta; si todo va bien, añade el dato y no devuelve nada.
  function montarFormulario(id, alAbrir, alGuardar) {
    const form = document.getElementById(id + '-form');
    const abrir = document.getElementById(id + '-abrir');
    const error = document.getElementById(id + '-error');
    const mostrar = (si) => {
      form.hidden = !si;
      abrir.setAttribute('aria-expanded', String(si));
      error.hidden = true;
      if (si) { form.reset(); alAbrir(form); form.elements[0].focus(); }
    };
    abrir.addEventListener('click', () => mostrar(form.hidden));
    form.querySelector('[data-cancelar]').addEventListener('click', () => mostrar(false));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fallo = alGuardar(form);
      if (fallo) { error.textContent = fallo[0]; error.hidden = false; fallo[1].focus(); return; }
      guardar(); mostrar(false); pintarTodo();
    });
  }

  // Horas de la cita de 10 en 10 minutos («Hasta» también admite 23:59, el tope de los botones de duración)
  {
    const f = document.getElementById('agenda-form');
    const horas = Array.from({ length: 144 }, (_, i) => `${String(Math.floor(i / 6)).padStart(2, '0')}:${String(i % 6 * 10).padStart(2, '0')}`);
    const opcion = (h) => { const o = el('option', null, h); o.value = h; return o; };
    f.hora.append(...horas.map(opcion));
    f.hasta.append(...horas.map(opcion), opcion('23:59'));
  }

  // Duración rápida: rellena «Hasta» a partir de la hora (sin pasar de medianoche)
  for (const b of document.querySelectorAll('#agenda-form .duracion')) {
    b.addEventListener('click', () => {
      const f = document.getElementById('agenda-form');
      const error = document.getElementById('agenda-error');
      if (!f.hora.value) { error.textContent = 'Pon primero la hora de inicio.'; error.hidden = false; f.hora.focus(); return; }
      const [h, m] = f.hora.value.split(':').map(Number);
      const fin = Math.min(h * 60 + m + Number(b.dataset.minutos), 23 * 60 + 59);
      f.hasta.value = `${String(Math.floor(fin / 60)).padStart(2, '0')}:${String(fin % 60).padStart(2, '0')}`;
      error.hidden = true;
    });
  }

  montarFormulario('agenda', (f) => { f.fecha.value = hoy; rellenarCalendarios(f); }, (f) => {
    const titulo = f.titulo.value.trim();
    if (!titulo) return ['Escribe qué es la cita.', f.titulo];
    if (!f.fecha.value) return ['Elige el día de la cita.', f.fecha];
    if (f.hasta.value && !f.hora.value) return ['Pon también la hora de inicio, o deja «Hasta» vacío.', f.hora];
    if (f.hasta.value && f.hasta.value <= f.hora.value) return ['«Hasta» tiene que ser más tarde que la hora.', f.hasta];
    const cita = { id: String(Date.now()), titulo, fecha: f.fecha.value, hora: f.hora.value, hasta: f.hasta.value, lugar: f.lugar.value.trim() };
    if (!f.querySelector('#agenda-cal').hidden) { crearCitaGoogle(cita, f.calendario.value); return; } // va a Google Calendar
    datos.agenda.push(cita);
  });

  montarFormulario('vence', () => {}, (f) => {
    const titulo = f.titulo.value.trim();
    if (!titulo) return ['Escribe qué vence.', f.titulo];
    if (!f.fecha.value) return ['Elige la fecha límite.', f.fecha];
    const importe = leerImporte(f.importe.value);
    if (Number.isNaN(importe)) return ['El importe no es válido. Escríbelo así: 68,40', f.importe];
    datos.vence.push({ id: String(Date.now()), titulo, fecha: f.fecha.value, importe });
  });

  montarFormulario('dinero', (f) => { f.fecha.value = hoy; rellenarCategorias(f); }, (f) => {
    const concepto = f.concepto.value.trim();
    if (!concepto) return ['Escribe el concepto.', f.concepto];
    const importe = leerImporte(f.importe.value);
    if (importe == null || Number.isNaN(importe) || importe === 0) return ['Escribe el importe, por ejemplo: 25,90', f.importe];
    if (!f.fecha.value) return ['Elige el día.', f.fecha];
    datos.dinero.push({ id: String(Date.now()), tipo: f.tipo.value, concepto, importe, categoria: f.categoria.value, fecha: f.fecha.value });
  });

  montarFormulario('sus', (f) => { f.fecha.value = hoy; }, (f) => {
    const nombre = f.nombre.value.trim();
    if (!nombre) return ['Escribe el nombre.', f.nombre];
    const importe = leerImporte(f.importe.value);
    if (importe == null || Number.isNaN(importe) || importe === 0) return ['Escribe el importe, por ejemplo: 9,99', f.importe];
    if (!f.fecha.value) return ['Elige el día del próximo cobro.', f.fecha];
    datos.suscripciones.push({ id: String(Date.now()), nombre, importe, periodo: f.periodo.value, fecha: f.fecha.value });
  });

  montarFormulario('hab', () => {}, (f) => {
    const nombre = f.nombre.value.trim();
    if (!nombre) return ['Escribe el hábito.', f.nombre];
    datos.habitos.push({ id: String(Date.now()), nombre, hechos: [] });
  });

  // ---------- Lista de la compra ----------
  const SECCIONES = ['Fruta y verdura', 'Carne y pescado', 'Lácteos y huevos', 'Panadería', 'Despensa', 'Congelados', 'Bebidas', 'Limpieza y hogar', 'Higiene', 'Otros'];
  const formCompra = document.getElementById('compra-form');
  formCompra.seccion.replaceChildren(...SECCIONES.map((s) => new Option(s, s)));
  formCompra.seccion.value = 'Otros';

  function filaArticulo(a) {
    const li = el('li', 'articulo' + (a.comprado ? ' articulo--hecho' : ''));
    const marca = el('button', 'hecho');
    marca.type = 'button';
    marca.innerHTML = icoHecho;
    marca.setAttribute('aria-pressed', String(a.comprado));
    marca.setAttribute('aria-label', a.comprado ? `Volver a poner «${a.nombre}» en la lista` : `Marcar «${a.nombre}» como comprado`);
    marca.addEventListener('click', () => { a.comprado = !a.comprado; guardar(); pintarCompra(); });
    const texto = el('span', 'articulo-texto', a.nombre);
    if (a.cantidad) texto.append(el('small', null, a.cantidad));
    li.append(marca, texto);
    return li;
  }

  function pintarCompra() {
    const caja = document.getElementById('compra-contenido');
    caja.replaceChildren();
    const pendientes = datos.compra.filter((a) => !a.comprado);
    const comprados = datos.compra.filter((a) => a.comprado);
    if (!datos.compra.length) { caja.append(el('p', 'vacio', 'La lista está vacía. Añade lo que haga falta.')); return; }

    const resumen = el('p', 'resumen');
    resumen.append(el('strong', null, String(pendientes.length)), pendientes.length === 1 ? 'artículo por comprar' : 'artículos por comprar');
    caja.append(resumen);

    // Agrupado por pasillos, en el orden del súper; lo comprado va al final
    const pasillos = el('div', 'pasillos');
    for (const s of SECCIONES) {
      const deAqui = pendientes.filter((a) => (SECCIONES.includes(a.seccion) ? a.seccion : 'Otros') === s);
      if (!deAqui.length) continue;
      const bloque = el('div', 'pasillo');
      const ul = el('ul', 'agenda-lista');
      ul.append(...deAqui.map(filaArticulo));
      bloque.append(el('h3', null, s), ul);
      pasillos.append(bloque);
    }
    if (comprados.length) {
      const bloque = el('div', 'pasillo');
      const cabecera = el('div', 'comprados-cabecera');
      const vaciar = el('button', 'boton-texto', 'Quitar comprados');
      vaciar.type = 'button';
      vaciar.addEventListener('click', () => {

  // ---------- Datos compartidos en Google Drive ----------
  // Un archivo «panel-de-vida-datos.json» dentro de la carpeta «Panel de vida» del primero que la crea,

  const DRIVE = 'https://www.googleapis.com/drive/v3/';
  const DRIVE_SUBIDA = 'https://www.googleapis.com/upload/drive/v3/';
  const PERMISO_DRIVE = 'https://www.googleapis.com/auth/drive.file';

  const PERMISO_CALENDAR = 'https://www.googleapis.com/auth/calendar.events';
  const PERMISOS = `${PERMISO_DRIVE} https://www.googleapis.com/auth/calendar.calendarlist.readonly ${PERMISO_CALENDAR}`;
  const CLAVE_SELECTOR = 'AIzaSyCfF_y76_iluT8MZSG1gumD__w7-92s5xY'; // solo sirve para el selector de Drive y solo desde vuestra dirección
  const NUMERO_PROYECTO = '786823678377';
  const NOMBRE_ARCHIVO = 'panel-de-vida-datos.json';
  const COLECCIONES = ['agenda', 'vence', 'dinero', 'suscripciones', 'habitos', 'compra', 'archivos'];
  const CLAVE_DRIVE = 'panel-drive';   // {archivoId, carpetaId, propio, base, sincronizado}
  const CLAVE_TOKEN = 'panel-token';   // {valor, caduca}
  let clienteToken = null;
  let estadoSync = 'ok';               // ok | trabajando | token | error | sinred

  const leerJSON = (clave) => { try { return JSON.parse(localStorage.getItem(clave)); } catch { return null; } };
  const escribirJSON = (clave, valor) => { try { valor == null ? localStorage.removeItem(clave) : localStorage.setItem(clave, JSON.stringify(valor)); } catch { /* sin espacio o modo privado */ } };
  function leerDrive() { return leerJSON(CLAVE_DRIVE); }
  const colecciones = (d) => Object.fromEntries(COLECCIONES.map((k) => [k, d?.[k] || []]));

  // Mezcla los cambios de este dispositivo y los del otro, tomando como referencia la última versión sincronizada (base):
  // lo que solo cambió aquí se queda, lo que solo cambió allí entra, y si los dos tocasteis lo mismo gana este dispositivo.
  // Un borrado nunca pisa un cambio del otro (mejor que sobre algo a que se pierda).
  function fusionar(base, local, remoto) {
    const resultado = {};
    for (const k of COLECCIONES) {
      const B = new Map((base?.[k] || []).map((x) => [x.id, JSON.stringify(x)]));
      const L = new Map((local?.[k] || []).map((x) => [x.id, x]));
      const R = new Map((remoto?.[k] || []).map((x) => [x.id, x]));
      const ids = [...new Set([...R.keys(), ...L.keys()])];
      resultado[k] = ids.flatMap((id) => {
        const l = L.get(id), r = R.get(id), b = B.get(id);
        const ls = l && JSON.stringify(l), rs = r && JSON.stringify(r);
        const elegido = ls === b ? r : rs === b ? l : (l ?? r);
        return elegido ? [elegido] : [];
      });
    }
    return resultado;
  }

  // --- Permiso de Google para tocar vuestro archivo de Drive (dura una hora; se renueva con un toque) ---
  // Los permisos de antes de Calendar no guardaban «scope»: se piden otra vez una sola vez
  function tokenValido() { const t = leerJSON(CLAVE_TOKEN); return t?.scope && t.caduca > Date.now() + 60000 ? t.valor : null; }
  const permisoCalendar = () => !!tokenValido() && leerJSON(CLAVE_TOKEN).scope.includes(PERMISO_CALENDAR);
  function pedirToken() {
    return new Promise((ok, mal) => {
      if (!clienteToken) return mal(new Error('Google aún no ha cargado. Prueba en unos segundos.'));
      clienteToken.callback = (r) => {
        if (r.error) return mal(new Error('Google no ha dado permiso.'));
        escribirJSON(CLAVE_TOKEN, { valor: r.access_token, caduca: Date.now() + r.expires_in * 1000, scope: r.scope || '' });
        setTimeout(() => { pintarCuenta(); cargarCalendario(); });
        ok(r.access_token);
      };
      clienteToken.error_callback = () => mal(new Error('Se cerró la ventana de Google sin dar permiso.'));
      clienteToken.requestAccessToken({ prompt: '', hint: sesion?.email });
    });
  }
  const conToken = async () => tokenValido() || pedirToken();

  async function llamarDrive(url, opciones = {}) {
    const resp = await fetch(url, { ...opciones, headers: { Authorization: `Bearer ${tokenValido()}`, ...opciones.headers } });
    if (resp.status === 401) { escribirJSON(CLAVE_TOKEN, null); throw Object.assign(new Error('Hay que volver a dar permiso a Drive.'), { token: true }); }
    if (resp.status === 404) throw Object.assign(new Error('No se encuentra el archivo compartido en Drive.'), { perdido: true });
    if (!resp.ok) throw new Error(`Drive respondió con un error (${resp.status}).`);
    return resp;
  }
  const versionRemota = async (id) => (await (await llamarDrive(`${DRIVE}files/${id}?fields=version`)).json()).version;
  const bajarRemoto = async (id) => (await llamarDrive(`${DRIVE}files/${id}?alt=media`)).json();
  const subirRemoto = (id, contenido) => llamarDrive(`${DRIVE_SUBIDA}files/${id}?uploadType=media`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(contenido),
  });

  // --- Sincronizar: bajar lo del otro, mezclar, subir lo de aquí ---
  function programarSincronizacion() {
    if (!leerDrive()?.archivoId) return;
    clearTimeout(temporizador);
    temporizador = setTimeout(sincronizar, 1500);
  }
  function sincronizar() { if (!enCurso) enCurso = sincronizarAhora().finally(() => { enCurso = null; }); return enCurso; }

  async function sincronizarAhora() {
    const cfg = leerDrive();
    if (!cfg?.archivoId || !sesion) return;
    if (!navigator.onLine) return ponerEstado('sinred');
    if (!tokenValido()) return ponerEstado('token');
    ponerEstado('trabajando');
    try {
      for (let intento = 0; intento < 3; intento++) {
        const version = await versionRemota(cfg.archivoId);
        const remoto = await bajarRemoto(cfg.archivoId);
        const mezcla = fusionar(cfg.base, colecciones(datos), colecciones(remoto));
        if (JSON.stringify(mezcla) !== JSON.stringify(colecciones(remoto))) {
          if ((await versionRemota(cfg.archivoId)) !== version) continue; // el otro guardó justo ahora: repetir con lo suyo
          await subirRemoto(cfg.archivoId, { ...mezcla, actualizado: new Date().toISOString(), por: sesion.nombre });
        }
        const cambiaAqui = JSON.stringify(mezcla) !== JSON.stringify(colecciones(datos));
        Object.assign(datos, mezcla);
        datos.ejemplo = false;
        guardarLocal();
        escribirJSON(CLAVE_DRIVE, { ...cfg, base: mezcla, sincronizado: new Date().toISOString() });
        if (cambiaAqui) pintarTodo();
        return ponerEstado('ok');
      }
      throw new Error('Los dos estabais guardando a la vez; se reintentará.');
    } catch (e) {
      ponerEstado(e.token ? 'token' : 'error', e.message);
    }
  }

  // --- Crear la carpeta compartida (lo hace el primero) ---
  async function crearCompartido() {
    await conToken();
    ponerEstado('trabajando');
    quitarEjemplos(); // los ejemplos no se suben a Drive
    guardarLocal();
    const carpeta = await (await llamarDrive(`${DRIVE}files?fields=id`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'Panel de vida', mimeType: 'application/vnd.google-apps.folder' }),
    })).json();
    const cuerpo = new FormData();
    cuerpo.append('metadata', new Blob([JSON.stringify({ name: NOMBRE_ARCHIVO, mimeType: 'application/json', parents: [carpeta.id] })], { type: 'application/json' }));
    cuerpo.append('file', new Blob([JSON.stringify({ ...colecciones(datos), actualizado: new Date().toISOString(), por: sesion.nombre })], { type: 'application/json' }));
    const archivo = await (await llamarDrive(`${DRIVE_SUBIDA}files?uploadType=multipart&fields=id`, { method: 'POST', body: cuerpo })).json();
    escribirJSON(CLAVE_DRIVE, { archivoId: archivo.id, carpetaId: carpeta.id, propio: true, base: colecciones(datos), sincronizado: new Date().toISOString() });
    pintarTodo(); pintarPie();
    ponerEstado('ok');
  }

  // --- Unirse: el segundo elige el archivo que le han compartido con el selector de Drive ---
  function cargarSelector() {
    return new Promise((ok, mal) => {
