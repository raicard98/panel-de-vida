  // La lista y las citas se guardan en este dispositivo (para verlas sin conexión); nada de esto va en el código público.
  const CALENDAR = 'https://www.googleapis.com/calendar/v3/';
  const CLAVE_CALENDARIO = 'panel-calendario'; // {calendarios: [{id, nombre, color}], elegidos: [id], eventos, cuenta, actualizado}
  let calendarioError = '', menuCalendariosAbierto = false;
  // Tocar fuera del desplegable de calendarios lo cierra
  document.addEventListener('click', (e) => {
    const menu = document.querySelector('.cal-menu');
    if (menu?.open && !menu.contains(e.target)) { menu.open = false; menuCalendariosAbierto = false; }
  });

  // Declarada como función (no const) porque la agenda la usa antes de llegar a este bloque
  function eventosCalendario() {
    try {
      const cfg = JSON.parse(localStorage.getItem('panel-calendario'));
      const cuenta = JSON.parse(localStorage.getItem('panel-sesion'))?.email;
      if (!cfg?.cuenta || cfg.cuenta !== cuenta) return [];
      const vistos = new Set(); // una cita que está en varios calendarios encendidos sale una vez
      const escribibles = new Set((cfg.calendarios || []).filter((c) => c.escribe).map((c) => c.id));
      return (cfg.eventos || []).filter((c) => cfg.elegidos?.includes(c.cal) && !vistos.has(c.id) && vistos.add(c.id))
        .map((c) => ({ ...c, escribe: escribibles.has(c.cal) }));
    } catch { return []; }
  }

  async function llamarCalendar(ruta, opciones = {}) {
    const resp = await fetch(CALENDAR + ruta, { ...opciones, headers: { Authorization: `Bearer ${tokenValido()}`, 'Content-Type': 'application/json' } });
    if (resp.status === 410 || resp.status === 204) return {}; // 410: ya estaba borrada
    if (resp.status === 401) { escribirJSON(CLAVE_TOKEN, null); throw new Error('Hay que volver a dar permiso a Google.'); }
    if (resp.status === 403) throw new Error('Google no deja ver uno de los calendarios. Revisa que siga compartido contigo.');
    if (resp.status === 404) throw new Error('Uno de los calendarios ya no existe o no está compartido contigo.');
    if (!resp.ok) throw new Error(`Google Calendar respondió con un error (${resp.status}).`);
    return resp.json();
  }

  // Pasa una cita de Google al formato de la agenda. Lo que empezó antes de hoy y sigue, se muestra hoy.
  function aCita(e, cal) {
    const inicio = e.start.dateTime ? new Date(e.start.dateTime) : null;
    const fecha = inicio ? diaISO(inicio) : e.start.date;
    const hora = inicio && fecha >= hoy ? `${String(inicio.getHours()).padStart(2, '0')}:${String(inicio.getMinutes()).padStart(2, '0')}` : '';
    return { id: `g-${e.id}`, titulo: e.summary || '(Sin título)', fecha: fecha < hoy ? hoy : fecha, hora, lugar: e.location || '', cal: cal.id, color: cal.color };
  }

  async function bajarEventos(cal) {
    const desde = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
    const hasta = new Date(desde); hasta.setDate(hasta.getDate() + 7);
    const q = new URLSearchParams({ timeMin: desde.toISOString(), timeMax: hasta.toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '250' });
    const r = await llamarCalendar(`calendars/${encodeURIComponent(cal.id)}/events?${q}`);
    return (r.items || []).filter((e) => e.status !== 'cancelled').map((e) => aCita(e, cal));
  }

  async function cargarCalendario() {
    if (!sesion || !navigator.onLine || !permisoCalendar()) return pintarAgendaGoogle();
    try {
      const lista = await llamarCalendar('users/me/calendarList?minAccessRole=reader');
      const items = (lista.items || []).sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0)); // el tuyo primero
      const calendarios = items.map((c) => ({ id: c.id, nombre: c.primary ? 'Tu calendario' : c.summaryOverride || c.summary, color: c.backgroundColor || '#0a84ff', escribe: ['owner', 'writer'].includes(c.accessRole) }));
      const previo = leerJSON(CLAVE_CALENDARIO);
      const mismaCuenta = previo?.cuenta === sesion.email;
      // La primera vez se marcan los mismos que tienes encendidos en Google Calendar
      const elegidos = (mismaCuenta && previo.elegidos ? previo.elegidos : items.filter((c) => c.selected).map((c) => c.id))
        .filter((id) => calendarios.some((c) => c.id === id));
      escribirJSON(CLAVE_CALENDARIO, { ...(mismaCuenta ? previo : {}), calendarios, elegidos, cuenta: sesion.email });
      const porCalendario = await Promise.all(calendarios.filter((c) => elegidos.includes(c.id)).map(bajarEventos));
      const eventos = porCalendario.flat();
      calendarioError = '';
      escribirJSON(CLAVE_CALENDARIO, { ...leerJSON(CLAVE_CALENDARIO), eventos, actualizado: new Date().toISOString() });
    } catch (e) { calendarioError = e.message; }
    pintarAgenda(); pintarAgendaGoogle();
  }

  // --- Apuntar y borrar citas en Google Calendar ---
  function calendariosEscribibles() {
    if (!sesion) return [];
    const cfg = leerJSON(CLAVE_CALENDARIO);
    return sesion && cfg?.cuenta === sesion.email ? (cfg.calendarios || []).filter((c) => c.escribe) : [];
  }
  // Lista del formulario: empieza en el último usado; si no, en el primero compartido que tengas encendido
  function rellenarCalendarios(form) {
    const lista = calendariosEscribibles();
    form.querySelector('#agenda-cal').hidden = !lista.length;
    form.calendario.replaceChildren(...lista.map((c) => { const op = el('option', null, c.nombre); op.value = c.id; return op; }));
    const cfg = leerJSON(CLAVE_CALENDARIO);
    form.calendario.value = lista.some((c) => c.id === cfg?.ultimo) ? cfg.ultimo : calendarioCompartido()?.id || '';
  }
  // El primer calendario compartido (no el tuyo) que tengas encendido; si no hay, el primero editable
  function calendarioCompartido() {
    const lista = calendariosEscribibles(), cfg = leerJSON(CLAVE_CALENDARIO);
    return lista.find((c) => c.nombre !== 'Tu calendario' && cfg?.elegidos?.includes(c.id)) || lista[0];
  }

  // --- Pasar a Google Calendar las citas apuntadas antes solo en el panel (las de ejemplo no) ---
  const citasSoloPanel = () => datos.agenda.filter((c) => !ID_EJEMPLO.test(c.id));
  async function pasarCitasViejas() {
    const destino = calendarioCompartido();
    const citas = citasSoloPanel();
    if (!destino || !citas.length) return;
    if (!confirm(`¿Pasar ${citas.length === 1 ? 'la cita' : `las ${citas.length} citas`} del panel a «${destino.nombre}» de Google Calendar? Después ya no estarán repetidas en el panel.`)) return;
    if (!permisoCalendar()) await pedirToken();
    let pasadas = 0, fallo = '';
    try {
      for (const c of citas) {
        await llamarCalendar(`calendars/${encodeURIComponent(destino.id)}/events`, { method: 'POST', body: JSON.stringify(cuerpoCita(c)) });
        datos.agenda = datos.agenda.filter((x) => x.id !== c.id); // se quita en cuanto está en Google: si algo falla, no se repite ni se pierde
        guardar();
        pasadas++;
      }
    } catch (err) {
      fallo = `Se han pasado ${pasadas} de ${citas.length}. El resto sigue en el panel; vuelve a pulsar para reintentar. (${err.message})`;
    }
    await cargarCalendario();
    calendarioError = fallo || calendarioError; // después de recargar, para que el aviso no se borre
    pintarAgendaGoogle();
  }

  const horaLocal = (fecha, hora) => `${fecha}T${hora}:00`;
  function cuerpoCita(c) {
    const zona = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (!c.hora) { // todo el día: Google quiere el día siguiente como final
      const fin = new Date(`${c.fecha}T12:00`); fin.setDate(fin.getDate() + 1);
      return { summary: c.titulo, location: c.lugar, start: { date: c.fecha }, end: { date: diaISO(fin) } };
    }
    let hasta = c.hasta;
    if (!hasta) { // sin «Hasta», dura una hora (sin pasar de medianoche)
      const [h, m] = c.hora.split(':').map(Number);
      hasta = h >= 23 ? '23:59' : `${String(h + 1).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }
    return { summary: c.titulo, location: c.lugar, start: { dateTime: horaLocal(c.fecha, c.hora), timeZone: zona }, end: { dateTime: horaLocal(c.fecha, hasta), timeZone: zona } };
  }

  async function crearCitaGoogle(cita, calId) {
    try {
      if (!permisoCalendar()) await pedirToken(); // se llama aún dentro del toque en «Guardar»: Google deja abrir su ventana
      const cal = calendariosEscribibles().find((c) => c.id === calId);
      const e = await llamarCalendar(`calendars/${encodeURIComponent(calId)}/events`, { method: 'POST', body: JSON.stringify(cuerpoCita(cita)) });
      const cfg = leerJSON(CLAVE_CALENDARIO);
      escribirJSON(CLAVE_CALENDARIO, { ...cfg, ultimo: calId, elegidos: cfg.elegidos.includes(calId) ? cfg.elegidos : [...cfg.elegidos, calId], eventos: [...(cfg.eventos || []), aCita(e, cal)] });
      calendarioError = '';
      pintarAgenda(); pintarAgendaGoogle();
    } catch (err) {
      // Que no se pierda: se queda apuntada en el panel
      datos.agenda.push(cita); guardar(); pintarAgenda();
      calendarioError = `No se pudo guardar en Google Calendar: ${err.message} La he dejado apuntada solo en el panel.`;
      pintarAgendaGoogle();
    }
  }

  async function borrarCitaGoogle(c) {
    const cal = calendariosEscribibles().find((x) => x.id === c.cal);
    if (!confirm(`¿Borrar «${c.titulo}» de Google Calendar${cal ? ` (${cal.nombre})` : ''}? Desaparece para todos los que vean ese calendario.`)) return;
    try {
      if (!permisoCalendar()) await pedirToken();
      await llamarCalendar(`calendars/${encodeURIComponent(c.cal)}/events/${encodeURIComponent(c.id.slice(2))}`, { method: 'DELETE' });
      const cfg = leerJSON(CLAVE_CALENDARIO);
      escribirJSON(CLAVE_CALENDARIO, { ...cfg, eventos: cfg.eventos.filter((x) => !(x.id === c.id && x.cal === c.cal)) });
      calendarioError = '';
    } catch (err) { calendarioError = `No se pudo borrar: ${err.message}`; }
    pintarAgenda(); pintarAgendaGoogle();
  }

  function cambiarElegido(id) {
    const cfg = leerJSON(CLAVE_CALENDARIO);
    const elegidos = cfg.elegidos.includes(id) ? cfg.elegidos.filter((x) => x !== id) : [...cfg.elegidos, id];
    escribirJSON(CLAVE_CALENDARIO, { ...cfg, elegidos });
    pintarAgenda(); pintarAgendaGoogle();
    if (elegidos.includes(id)) cargarCalendario(); // al encender uno, se bajan sus citas
  }

  function pintarAgendaGoogle() {
    const caja = document.getElementById('agenda-google');
    caja.replaceChildren();
    if (!location.protocol.startsWith('http') || !sesion) return;
    const cfg = leerJSON(CLAVE_CALENDARIO);
    const boton = (texto, alPulsar) => {
      const b = el('button', 'boton-texto', texto);
      b.type = 'button';
      b.addEventListener('click', async () => {
        b.disabled = true;
        try { await alPulsar(); } catch (e) { calendarioError = e.message; pintarAgendaGoogle(); }
      });
      return b;
    };
    if (cfg?.calendarios && cfg.cuenta === sesion.email) {
      // Desplegable con una casilla por calendario; se queda abierto mientras marcas varios
      const menu = el('details', 'cal-menu');
      menu.open = menuCalendariosAbierto;
      menu.addEventListener('toggle', () => { menuCalendariosAbierto = menu.open; });
      const resumen = el('summary', 'cal-resumen');
      const puntos = el('span', 'cal-puntos');
      for (const c of cfg.calendarios.filter((x) => cfg.elegidos.includes(x.id))) {
        const p = el('span', 'cal-punto'); p.style.setProperty('--cal', c.color); puntos.append(p);
      }
      resumen.append(puntos, `Calendarios · ${cfg.elegidos.length} de ${cfg.calendarios.length}`);
      const lista = el('div', 'cal-lista');
      for (const c of cfg.calendarios) {
        const fila = el('label', 'cal-opcion');
        const casilla = el('input');
        casilla.type = 'checkbox';
        casilla.checked = cfg.elegidos.includes(c.id);
        casilla.style.setProperty('--cal', c.color);
        casilla.addEventListener('change', () => cambiarElegido(c.id));
        const p = el('span', 'cal-punto'); p.style.setProperty('--cal', c.color);
        fila.append(casilla, p, el('span', 'cal-nombre', c.nombre));
        lista.append(fila);
      }
      menu.append(resumen, lista);
      caja.append(menu);
      const viejas = citasSoloPanel().length;
      if (viejas && calendariosEscribibles().length) {
        caja.append(el('p', 'agenda-viejas', `${viejas === 1 ? 'Tienes 1 cita apuntada' : `Tienes ${viejas} citas apuntadas`} solo en el panel.`),
          boton('Pasarlas a Google Calendar', pasarCitasViejas));
      }
      if (!permisoCalendar()) caja.append(boton('Actualizar calendario', pedirToken));
    } else if (permisoCalendar()) {
      caja.append(el('p', null, 'Cargando tus calendarios…'));
    } else {
      caja.append(el('p', null, 'Conecta Google Calendar para ver aquí tus citas.'), boton('Conectar Google Calendar', pedirToken));
    }
    if (calendarioError) caja.append(el('p', 'error', calendarioError));
  }

  // ---------- Subir archivos a Drive: foto o archivo → eliges la carpeta → se sube ----------
  let archivoPendiente = null, archivosEstado = '', archivosError = false, subiendo = false;
  const entradaArchivo = document.getElementById('archivos-input');
  document.getElementById('archivos-subir').addEventListener('click', () => entradaArchivo.click());
  entradaArchivo.addEventListener('change', () => {
    archivoPendiente = entradaArchivo.files[0] || null;
    entradaArchivo.value = '';
    if (archivoPendiente) continuarSubida();
  });

  // Selector de Drive en modo carpetas: las tuyas y las que te han compartido (solo se da acceso a la que elijas)
  async function elegirCarpeta(nombre) {
    const token = tokenValido();
    await cargarSelector();
    return new Promise((ok) => {
      const vista = (etiqueta) => new google.picker.DocsView(google.picker.ViewId.FOLDERS)
        .setSelectFolderEnabled(true).setIncludeFolders(true).setMimeTypes('application/vnd.google-apps.folder').setLabel(etiqueta);
      new google.picker.PickerBuilder()
        .addView(vista('Mis carpetas').setParent('root'))
        .addView(vista('Compartidas conmigo').setOwnedByMe(false))
        .setOAuthToken(token).setDeveloperKey(CLAVE_SELECTOR).setAppId(NUMERO_PROYECTO)
        .setLocale('es').setTitle(`¿En qué carpeta guardas «${nombre}»?`)
        .setCallback((r) => {
          if (r.action === google.picker.Action.PICKED) ok({ id: r.docs[0].id, nombre: r.docs[0].name });
          else if (r.action === google.picker.Action.CANCEL) ok(null);
        })
        .build().setVisible(true);
    });
  }

  // Subida «reanudable» de Google: admite fotos y archivos grandes en una sola petición
  async function subirArchivo(archivo, carpeta) {
    const tipo = archivo.type || 'application/octet-stream';
    const inicio = await llamarDrive(`${DRIVE_SUBIDA}files?uploadType=resumable&fields=id,name,mimeType,webViewLink`, {
      method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': tipo },
      body: JSON.stringify({ name: archivo.name, parents: [carpeta.id] }),
    });
    const destino = inicio.headers.get('Location');
    if (!destino) throw new Error('Google no ha dejado empezar la subida.');
    const resp = await fetch(destino, { method: 'PUT', headers: { 'Content-Type': tipo }, body: archivo });
    if (!resp.ok) throw new Error(`Drive respondió con un error al subir (${resp.status}).`);
    return resp.json();
  }

  // --- Buscar en Drive: el selector de Google con todo vuestro Drive; lo elegido se abre en Drive ---
  let archivoAbrir = null; // si el navegador bloquea la pestaña nueva, se ofrece un enlace para tocar
  document.getElementById('archivos-buscar').addEventListener('click', async () => {
    try {
      if (!tokenValido()) await pedirToken();
      await cargarSelector();
      const vista = (etiqueta) => new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true).setLabel(etiqueta);
      new google.picker.PickerBuilder()
        .addView(vista('Mi unidad').setParent('root'))
        .addView(vista('Compartidos conmigo').setOwnedByMe(false))
        .addView(new google.picker.DocsView(google.picker.ViewId.RECENTLY_PICKED).setLabel('Recientes'))
        .setOAuthToken(tokenValido()).setDeveloperKey(CLAVE_SELECTOR).setAppId(NUMERO_PROYECTO)
        .setLocale('es').setTitle('Buscar en vuestro Drive')
        .setCallback((r) => {
          if (r.action !== google.picker.Action.PICKED) return;
          const doc = r.docs[0];
          if (!/^https:\/\//.test(doc.url)) return;
          const ventana = window.open(doc.url, '_blank'); // sin «noopener»: con él siempre devuelve null y no sabríamos si se abrió
          if (ventana) ventana.opener = null;
          archivoAbrir = ventana ? null : { nombre: doc.name, url: doc.url };
          archivosEstado = ''; archivosError = false;
          pintarArchivosAcciones();
        })
        .build().setVisible(true);
    } catch (e) { archivosError = true; archivosEstado = e.message; pintarArchivosAcciones(); }
  });

  async function continuarSubida() {
    if (!tokenValido()) return pintarArchivosAcciones(); // hace falta un toque para el permiso: lo pide el botón «Elegir carpeta»
    const archivo = archivoPendiente;
    try {
      const carpeta = await elegirCarpeta(archivo.name);
      if (!carpeta) { archivoPendiente = null; archivosEstado = ''; return pintarArchivosAcciones(); }
      subiendo = true; archivosError = false;
      archivosEstado = `Subiendo «${archivo.name}» a «${carpeta.nombre}»…`;
      pintarArchivosAcciones();
      const f = await subirArchivo(archivo, carpeta);
      datos.archivos.push({ id: f.id, nombre: f.name, tipo: f.mimeType, enlace: f.webViewLink, carpeta: carpeta.nombre, fecha: new Date().toISOString(), por: sesion.nombre });
      guardar(); pintarArchivos();
      archivosEstado = `«${f.name}» subido a «${carpeta.nombre}».`;
    } catch (e) {
      archivosError = true;
      archivosEstado = `No se pudo subir «${archivo.name}»: ${e.message}`;
    }
    archivoPendiente = null; subiendo = false;
    pintarArchivosAcciones();
  }

  function pintarArchivosAcciones() {
    const barra = document.getElementById('archivos-barra');
    const puede = location.protocol.startsWith('http') && !!sesion;
    document.getElementById('archivos-subir').hidden = !puede || subiendo;
    document.getElementById('archivos-buscar').hidden = !puede;
    barra.replaceChildren();
    if (puede && archivoAbrir) {
      const enlace = el('a', 'boton boton--principal', `Abrir «${archivoAbrir.nombre}»`);
      enlace.href = archivoAbrir.url; enlace.target = '_blank'; enlace.rel = 'noopener';
      enlace.addEventListener('click', () => { archivoAbrir = null; setTimeout(pintarArchivosAcciones); });
      barra.append(enlace);
    }
    if (!puede) return barra.append(el('p', null, location.protocol.startsWith('http') ? 'Entra con Google para subir archivos a vuestro Drive.' : 'Para subir archivos, abre el panel desde su dirección.'));
    if (archivoPendiente && !subiendo) {
      const elegir = el('button', 'boton boton--principal', 'Elegir carpeta');
      elegir.type = 'button';
      elegir.addEventListener('click', async () => {
        try { await pedirToken(); continuarSubida(); } catch (e) { archivosError = true; archivosEstado = e.message; pintarArchivosAcciones(); }
      });
      const cancelar = el('button', 'boton', 'Cancelar');
      cancelar.type = 'button';
      cancelar.addEventListener('click', () => { archivoPendiente = null; archivosEstado = ''; pintarArchivosAcciones(); });
      barra.append(el('p', null, `«${archivoPendiente.name}» listo. Toca para dar permiso a Google y elegir la carpeta.`), elegir, cancelar);
      return;
    }
    if (archivosEstado) barra.append(el('p', archivosError ? 'error' : null, archivosEstado));
  }

  // ---------- Entrar con Google: cada uno con su cuenta ----------
  // Solo funciona con el panel publicado (Google no acepta páginas abiertas con doble clic).
  const CLIENTE_GOOGLE = '786823678377-ffdiajgej160p2kkomiqnh8illckbj8q.apps.googleusercontent.com';
  const CLAVE_SESION = 'panel-sesion';
  let sesion = null;
  try { sesion = JSON.parse(localStorage.getItem(CLAVE_SESION)); } catch { sesion = null; }

  // Lee los datos de la credencial que devuelve Google (nombre, email, foto). Solo para mostrarlos.
  function leerCredencial(token) {
    const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))));
  }

  function pintarCuenta() {
    const caja = document.getElementById('cuenta');
    caja.replaceChildren();
    pintarSaludo(sesion?.nombre);
    if (sesion) {
      const foto = el('img');
      foto.alt = '';
      foto.referrerPolicy = 'no-referrer';
      if (sesion.foto) foto.src = sesion.foto;
      const nombre = el('span', 'cuenta-nombre', sesion.nombreCompleto || sesion.nombre);
      nombre.append(el('small', null, sesion.email));
      const salir = el('button', 'boton-texto', 'Salir');
      salir.type = 'button';
      salir.addEventListener('click', () => {
        window.google?.accounts.id.disableAutoSelect();
        const token = tokenValido();
        if (token) window.google?.accounts.oauth2?.revoke(token);
        escribirJSON(CLAVE_TOKEN, null);
        sesion = null;
        try { localStorage.removeItem(CLAVE_SESION); } catch { /* nada que borrar */ }
        pintarCuenta(); pintarAgenda();
      });
      const chip = chipSincronizacion();
      if (chip) caja.append(chip);
      caja.append(foto, nombre, salir);
    } else if (window.google?.accounts?.id) {
      const boton = el('div');
      caja.append(boton);
      // En el móvil, solo el icono redondo de Google para no apretar el saludo
      const movil = matchMedia('(max-width: 600px)').matches;
      google.accounts.id.renderButton(boton, { type: movil ? 'icon' : 'standard', theme: 'filled_black', shape: movil ? 'circle' : 'pill', size: 'large', text: 'signin_with', locale: 'es_ES' });
    }
    pintarDrive();
    pintarAgendaGoogle();
    pintarArchivosAcciones();
  }

  function alEntrar(respuesta) {
    const d = leerCredencial(respuesta.credential);
    sesion = { nombre: d.given_name || d.name, nombreCompleto: d.name, email: d.email, foto: d.picture };
    try { localStorage.setItem(CLAVE_SESION, JSON.stringify(sesion)); } catch { /* sin guardar: habrá que entrar otra vez */ }
    pintarCuenta(); pintarAgenda(); cargarCalendario();
  }

  pintarCuenta();
  if (location.protocol.startsWith('http')) {
    const gsi = document.createElement('script');
    gsi.src = 'https://accounts.google.com/gsi/client?hl=es';
    gsi.async = true;
    gsi.onload = () => {
      google.accounts.id.initialize({ client_id: CLIENTE_GOOGLE, callback: alEntrar, auto_select: true, use_fedcm_for_prompt: true });
      clienteToken = google.accounts.oauth2.initTokenClient({ client_id: CLIENTE_GOOGLE, scope: PERMISOS, callback: () => {} });
      pintarCuenta();
      if (!sesion) google.accounts.id.prompt(); // si ya entraste antes en este móvil, entra solo
    };
    gsi.onerror = () => {
      if (!sesion) document.getElementById('cuenta').replaceChildren(el('p', 'cuenta-aviso', 'Sin conexión con Google: no se puede entrar ahora.'));
    };
    document.head.append(gsi);
  }
  cargarCalendario();
  sincronizar(); // al abrir: trae lo que haya cambiado tu pareja (si el permiso de Drive sigue vigente)

  // App instalable y sin conexión: solo funciona cuando el panel está publicado en internet (no al abrirlo con doble clic).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sin modo sin conexión; el panel sigue funcionando */ });
  }

  // Autocomprobación de importes y fechas (sale en la consola solo si algo falla).
  console.assert(leerImporte('1.234,56') === 1234.56 && leerImporte('68.40') === 68.4 && leerImporte('') === null && Number.isNaN(leerImporte('abc')), 'leerImporte');
  console.assert(euros(1234.56).replace(/\s/g, ' ') === '1.234,56 €', 'euros: ' + euros(1234.56));
  console.assert(diasHasta(masDias(3)) === 3 && diasHasta(hoy) === 0, 'diasHasta');
  {
    const a = (id, x = '') => ({ id, n: id + x });
    const m = fusionar({ compra: [a('1'), a('2'), a('3')] }, { compra: [a('1', 'L'), a('2'), a('5')] }, { compra: [a('1'), a('2', 'R'), a('3'), a('6')] }).compra.map((x) => x.n).join();
    console.assert(m === '1L,2R,6,5', 'fusionar: ' + m);
    console.assert(fusionar({ compra: [a('7')] }, { compra: [] }, { compra: [a('7', 'R')] }).compra[0]?.n === '7R', 'fusionar: un borrado no pisa un cambio');
  }
  {
    const m2 = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + 2, 9, 5);
    const t = aCita({ id: 'x', summary: 'Médico', start: { dateTime: m2.toISOString() } }, { id: 'c1', color: '#f00' });
    const td = aCita({ id: 'y', start: { date: masDias(-1) } }, { id: 'c2', color: '#0f0' });
    console.assert(t.fecha === masDias(2) && t.hora === '09:05' && t.id === 'g-x' && t.cal === 'c1' && t.color === '#f00' && td.fecha === hoy && td.hora === '' && td.titulo === '(Sin título)', 'aCita');
  }
  {
    const todo = cuerpoCita({ titulo: 'A', fecha: '2026-12-31', hora: '', lugar: '' });
    const una = cuerpoCita({ titulo: 'B', fecha: '2026-03-29', hora: '23:30', hasta: '', lugar: '' });
    const con = cuerpoCita({ titulo: 'C', fecha: '2026-03-29', hora: '09:00', hasta: '10:15', lugar: 'X' });
    console.assert(todo.end.date === '2027-01-01' && una.end.dateTime === '2026-03-29T23:59:00' && con.end.dateTime === '2026-03-29T10:15:00' && con.start.dateTime === '2026-03-29T09:00:00', 'cuerpoCita');
  }
  console.assert(racha({ hechos: [masDias(-1), masDias(-2), masDias(-4)] }) === 2 && racha({ hechos: [hoy, masDias(-1)] }) === 2 && racha({ hechos: [] }) === 0, 'racha');
  console.assert(proximoCobro({ fecha: masDias(-30), periodo: 'mensual' }) >= hoy && proximoCobro({ fecha: masDias(5), periodo: 'anual' }) === masDias(5), 'proximoCobro');
</script>
